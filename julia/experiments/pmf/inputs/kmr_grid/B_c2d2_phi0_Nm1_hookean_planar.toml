[run]
label = "B_c2d2_phi0_Nm1_hookean_planar"

# KMR comparison grid (docs/logs/aru-to-ko/2026-10-16_kmr-comparison-grid.md) — generated by run_kmr_grid.jl --gen-tomls
# block B: drag=c2d2, phi=0.0, Nm=1, spectrum=blob, force=hookean

[polymer]
Q0_sq   = 1.0
kBT     = 1.0
lambda0 = 1.0
NK      = 5000
Nm      = 1
hK_star = 0.25

[concentration]
phi = 0.0

[model]
fe_model          = "hookean"
drag_model        = "c2d2"
drag_interp       = "RP"
draining_model    = "nondraining"
spectrum_model    = "blob"
drag_lut_n_points = 4000

[limits]
Wi_max              = "Inf"
max_frac_stretch_sq = 0.999

[continuation]
max_steps = 20000
ds0       = 0.001
ds_min    = 1e-10
ds_max    = 100.0

[newton]
tol_res                  = 1e-10
max_newton               = 30
target_newton            = 10
target_offmanifold_ratio = 0.3
min_denom_tol            = 0.0
tol_J_cond               = 1e-14
use_armijo               = true
armijo_c1                = 1e-4
armijo_beta              = 0.5
max_bt                   = 30

[newton_fixed_Y]
max_newton_fixed_Y = 30
tol_FY_rel_hard    = 100.0
tol_FY_rel_soft    = 1e-2

[flow]
kind   = "styext"
alphas = [1.0, -1.0, 0.0]
